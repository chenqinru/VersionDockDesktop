<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 7px 0 10px;
      border: 1px solid #454545;
      border-radius: 6px;
      background: #252526;
      color: #e5e5e5;
      font: 500 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body.light { border-color: #c9c9c9; background: #f3f3f3; color: #333; }
    .project-icon {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 3.5px;
      color: #ffffff !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: 9.5px;
      line-height: 1;
      text-transform: uppercase;
      user-select: none;
      -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      flex-shrink: 0;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.16);
      margin-right: 1px;
    }
    .project-icon.two-letters {
      font-size: 8.5px;
      letter-spacing: -0.04em;
    }
    .project-icon-letters {
      display: block;
      line-height: 1;
      transform: translateY(0.5px);
    }
    span.titlebar-tab-title { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    i { width: 16px; flex: 0 0 16px; text-align: center; font-style: normal; opacity: .6; }
  </style>
</head>
<body>
  <span class="project-icon" aria-hidden="true">
    <span class="project-icon-letters"></span>
  </span>
  <span class="titlebar-tab-title"></span><i>×</i>
  <script src="./tab-drag-preview.js"></script>
</body>
</html>
