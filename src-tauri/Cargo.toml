[package]
name = "versiondock-desktop"
version = "0.1.17"
description = "Independent Git and SVN desktop workbench built with Tauri 2, Rust and React"
authors = ["chenqinru"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/chenqinru/VersionDockDesktop"
homepage = "https://github.com/chenqinru/VersionDockDesktop"
readme = "../README.md"
keywords = ["git", "svn", "tauri", "desktop", "vcs"]
categories = ["development-tools"]

[lib]
name = "versiondock_desktop_lib"
# The desktop executable links this Rust library; no mobile/C ABI consumers.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-os = "2.3.2"
tauri-plugin-system-symbols = "0.3.0"
tauri-plugin-window-controls = "0.1.4"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["process", "time", "io-util", "sync", "macros", "fs"] }
tokio-util = "0.7.17"
thiserror = "2.0.17"
sha1 = "0.10.6"
sha2 = "0.10.9"
hex = "0.4.3"
chrono = { version = "0.4.42", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4"] }
roxmltree = "0.21.1"
glob = "0.3.3"
base64 = "0.22.1"
notify = "8.2.0"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
url = "2.5.8"
trash = "5.2.3"
libc = "0.2.177"
tempfile = "3.23.0"
dunce = "1.0.5"
json5 = "0.4.1"
ignore = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.55.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDate", "NSNotification", "NSOperation", "NSRunLoop", "NSString", "block2"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKContentWorld", "WKFrameInfo", "WKWebView", "block2"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow", "NSButton", "NSControl", "NSView", "NSResponder", "NSWorkspace", "NSAccessibility"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
specta = { version = "2.0.0-rc.25", features = ["derive", "collect", "serde_json", "chrono"] }
specta-serde = "0.0.12"
specta-typescript = "0.0.12"

[profile.dev]
opt-level = 1
debug = 1
incremental = false

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

[patch.crates-io]
# AppKit animations must not run while Tao holds its window-state mutex.
# See vendor/tao/PATCHES.md for the narrowly scoped macOS change.
tao = { path = "vendor/tao" }
