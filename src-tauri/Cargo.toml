[package]
name = "versiondock-desktop"
version = "0.1.0"
description = "Independent Git and SVN desktop workbench"
authors = ["chenqinru"]
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "versiondock_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-os = "2.3.2"
tauri-plugin-system-symbols = "0.3.0"
tauri-plugin-window-controls = "0.1.4"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-notification = "2.3.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["process", "time", "io-util", "sync", "macros", "fs"] }
tokio-util = "0.7.17"
thiserror = "2.0.17"
sha1 = "0.10.6"
sha2 = "0.10.9"
hex = "0.4.3"
chrono = { version = "0.4.42", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4"] }
roxmltree = "0.21.1"
notify = "8.2.0"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
trash = "5.2.3"
specta = { version = "2.0.0-rc.25", features = ["derive", "collect", "serde_json", "chrono"] }
specta-serde = "0.0.12"
specta-typescript = "0.0.12"

[dev-dependencies]
tempfile = "3.23.0"
url = "2.5.8"
