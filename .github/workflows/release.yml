name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag to build (e.g. v0.1.1)
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  source:
    name: Resolve release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Validate stable tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node -e 'if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(process.env.RELEASE_TAG)) throw new Error("An existing stable version tag is required")'

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Verify release version and pin source commit
        id: version
        env:
          GITHUB_REF_TYPE: tag
          GITHUB_REF_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          node scripts/check-version.mjs
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  assets:
    name: Prepare release frontend
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build release frontend once
        run: npx vite build

      - name: Save release frontend
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: frontend-release-${{ needs.source.outputs.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Check release frontend
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install signature verifier
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends minisign

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

      - name: Check frontend source
        # Keep manual retries compatible with tags created before the CI script split.
        run: |
          if node -e "process.exit(require('./package.json').scripts['check:frontend:source'] ? 0 : 1)"; then
            npm run check:frontend:source
          else
            npm run check:metadata
            npm run check:independence
            npm run check:window
            npm run check:i18n
            npm run typecheck
            npm run lint
            npm run test:release
            npm run test
          fi

  rust:
    name: Check release Rust
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Match ordinary CI so binding export and the complete test suite reuse
      # its test-profile dependencies. The shipped release profile is unchanged.
      CARGO_PROFILE_TEST_OPT_LEVEL: "0"
      CARGO_PROFILE_TEST_DEBUG: "1"
    steps:
      - name: Checkout pinned source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - name: Setup Node for binding verification
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          prefix-key: v1-versiondock-target
          shared-key: native-quality
          # Tag caches cannot be read by the next tag. Reuse main's cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev subversion

      - name: Verify generated bindings and defaults
        run: npm run bindings:check

      - name: Run complete Rust checks
        run: npm run check:rust
        env:
          VERSIONDOCK_REQUIRE_VCS_TESTS: "1"

  verify:
    name: Verify release
    if: always()
    needs: [source, frontend, rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ needs.source.outputs.version }}
      sha: ${{ needs.source.outputs.sha }}
    steps:
      - name: Require all release checks to succeed
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: test "$SOURCE_RESULT" = success && test "$FRONTEND_RESULT" = success && test "$RUST_RESULT" = success

  build:
    name: Build (${{ matrix.name }})
    # Build while source checks run; publishing still requires verify AND every platform.
    needs: [source, assets]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            platform: macos
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle-args: --target universal-apple-darwin
          - name: Windows x64
            platform: windows
            os: windows-latest
            rust-targets: ''
            bundle-args: ''
          - name: Linux x64
            platform: linux
            os: ubuntu-24.04
            rust-targets: ''
            bundle-args: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout pinned source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # Target paths are relative to the workspace, not the repository root.
          workspaces: src-tauri -> target
          # Start a new cache namespace so old registry-only hits cannot mask this fix.
          prefix-key: v1-versiondock-target
          shared-key: native-bundles
          # warm-release-cache.yml seeds this cache on main for all version tags.
          # Skip tag-local compression/uploads that cannot benefit the next tag.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Download release frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-release-${{ needs.source.outputs.sha }}
          path: dist

      - name: Install frontend dependencies
        run: npm ci

      - name: Reuse release frontend for packaging
        run: node -e "require('node:fs').writeFileSync('src-tauri/tauri.reuse-frontend.conf.json', JSON.stringify({build:{beforeBuildCommand:null}}))"

      - name: Configure GitLab update mirror without credentials
        env:
          GITLAB_RELEASE_PROJECT_ID: ${{ vars.GITLAB_RELEASE_PROJECT_ID }}
          GITLAB_RELEASE_URL: ${{ vars.GITLAB_RELEASE_URL }}
          GITLAB_RELEASE_PACKAGE: ${{ vars.GITLAB_RELEASE_PACKAGE }}
          GITLAB_RELEASE_BRANCH: ${{ vars.GITLAB_RELEASE_BRANCH }}
        run: node scripts/gitlab-release-config.mjs

      - name: Build signed bundles without publishing
        id: bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: false
          args: --ci --config src-tauri/tauri.reuse-frontend.conf.json --config src-tauri/tauri.release-updater.conf.json ${{ matrix.bundle-args }}

      - name: Verify macOS app bundle signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 "src-tauri/target/universal-apple-darwin/release/bundle/macos/VersionDock Desktop.app"

      - name: Stage only installation assets and signatures
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_VERSION: ${{ steps.bundles.outputs.appVersion }}
          RELEASE_ARTIFACT_PATHS: ${{ steps.bundles.outputs.artifactPaths }}
          RELEASE_OUTPUT_DIR: ${{ runner.temp }}/release-${{ matrix.platform }}
        run: node scripts/release-artifacts.mjs stage

      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: release-${{ matrix.platform }}
          path: ${{ runner.temp }}/release-${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish complete release
    needs: [verify, build]
    permissions:
      contents: write
    runs-on: [self-hosted, linux, x64, gitlab-publish]
    timeout-minutes: 30
    concurrency:
      group: versiondock-public-release
      cancel-in-progress: false
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      RELEASE_SOURCE_SHA: ${{ needs.verify.outputs.sha }}
    steps:
      - name: Checkout verified source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Verify publishing tools
        run: |
          command -v git
          command -v minisign
          command -v gh
          gh --version

      - name: Configure artifact paths
        run: |
          echo "RELEASE_ARTIFACTS_DIR=$RUNNER_TEMP/release-artifacts" >> "$GITHUB_ENV"
          echo "RELEASE_OUTPUT_DIR=$RUNNER_TEMP/prepared-release" >> "$GITHUB_ENV"

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: ${{ env.RELEASE_ARTIFACTS_DIR }}

      - name: Verify packages against client public key and generate manifest
        run: node scripts/release-artifacts.mjs prepare

      - name: Upload GitLab packages, verify hashes, then publish mirror manifest
        if: vars.GITLAB_RELEASE_PROJECT_ID != ''
        env:
          GITLAB_RELEASE_PROJECT_ID: ${{ vars.GITLAB_RELEASE_PROJECT_ID }}
          GITLAB_RELEASE_URL: ${{ vars.GITLAB_RELEASE_URL }}
          GITLAB_RELEASE_PACKAGE: ${{ vars.GITLAB_RELEASE_PACKAGE }}
          GITLAB_RELEASE_BRANCH: ${{ vars.GITLAB_RELEASE_BRANCH }}
          GITLAB_RELEASE_TOKEN: ${{ secrets.GITLAB_RELEASE_TOKEN }}
        run: node scripts/publish-gitlab-release.mjs

      - name: Upload, verify and publish public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
