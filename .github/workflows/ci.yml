name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> src-tauri/target

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev subversion

      - name: macOS SVN tools
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install subversion

      - name: Windows SVN tools
        if: runner.os == 'Windows'
        run: |
          choco install svn -y --no-progress
          $paths = @(
            "C:\Program Files\SilkSVN\bin",
            "C:\Program Files (x86)\SilkSVN\bin",
            "C:\Program Files\TortoiseSVN\bin",
            "C:\Program Files (x86)\TortoiseSVN\bin",
            "C:\Program Files\VisualSVN\bin",
            "C:\ProgramData\chocolatey\bin",
            "C:\ProgramData\chocolatey\lib\svn\tools"
          )
          foreach ($p in $paths) {
            if (Test-Path $p) {
              $p | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $env:PATH = "$p;$env:PATH"
            }
          }
          $found = (Get-ChildItem -Path "C:\Program Files", "C:\Program Files (x86)", "C:\ProgramData" -Filter "svn.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1)
          if ($found) {
            $dir = $found.DirectoryName
            $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "$dir;$env:PATH"
          }
          where.exe svn
          svn --version

      - name: Install dependencies
        run: npm ci

      - name: Static checks and tests
        run: npm run check
        env:
          VERSIONDOCK_REQUIRE_VCS_TESTS: "1"
