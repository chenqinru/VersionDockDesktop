name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bundle:
        description: Build private installation packages after all checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install signature verifier
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends minisign

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

      - name: Check frontend and project metadata
        run: npm run check:frontend:ci

      - name: Save checked frontend
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: frontend-ci-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node for binding verification
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # Target paths are relative to the workspace, not the repository root.
          workspaces: src-tauri -> target
          prefix-key: v1-versiondock-target
          shared-key: native-quality

      - name: Install Linux system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Verify generated bindings and defaults
        run: npm run bindings:check

  quality:
    # Preserve the existing required-check name and fail when either check fails.
    name: Quality gate
    if: always()
    needs: [frontend, rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all quality checks to succeed
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: test "$FRONTEND_RESULT" = success && test "$RUST_RESULT" = success

  platform:
    name: Test and bundle (${{ matrix.name }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            timeout: 45
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle-args: --target universal-apple-darwin
          - name: Windows x64
            os: windows-latest
            timeout: 75
            rust-targets: ''
            bundle-args: ''
          - name: Linux x64
            os: ubuntu-24.04
            timeout: 45
            rust-targets: ''
            bundle-args: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        if: inputs.bundle
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # Target paths are relative to the workspace, not the repository root.
          workspaces: src-tauri -> target
          # Start a new cache namespace so old registry-only hits cannot mask this fix.
          prefix-key: v1-versiondock-target
          shared-key: ${{ inputs.bundle && 'native-bundles' || 'native-tests' }}
          cache-on-failure: true

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf subversion

      - name: Install macOS SVN tools
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install subversion

      - name: Restore Unicode-capable Windows SVN cache
        if: runner.os == 'Windows'
        id: windows-svn-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/versiondock-svn
          key: windows-svn-x64-r1935602-vcpkg-e99d87dc-${{ hashFiles('scripts/setup-windows-svn.ps1') }}

      - name: Prepare Unicode-capable Windows SVN
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $svnCache = Join-Path $env:RUNNER_TEMP "versiondock-svn"
          ./scripts/setup-windows-svn.ps1 -CacheRoot $svnCache
          $svnPath = (Resolve-Path (Join-Path $svnCache "runtime/bin")).Path
          $svnPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$svnPath;$env:PATH"
          where.exe svn
          where.exe svnadmin
          svn --version --quiet
          svnadmin --version --quiet

      - name: Verify Windows SVN Unicode paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Assert-NativeSuccess([string]$command) {
            if ($LASTEXITCODE -ne 0) {
              throw "$command failed with exit code $LASTEXITCODE"
            }
          }
          $smokeRoot = Join-Path $env:RUNNER_TEMP "versiondock-svn-unicode-smoke"
          $repository = Join-Path $smokeRoot "repository"
          $workingCopy = Join-Path $smokeRoot "工作 副本"
          New-Item -ItemType Directory -Path $smokeRoot -Force | Out-Null
          svnadmin create $repository
          Assert-NativeSuccess "svnadmin create"
          $repositoryUrl = ([System.Uri]$repository).AbsoluteUri
          svn checkout $repositoryUrl $workingCopy
          Assert-NativeSuccess "svn checkout"
          $unicodeFile = Join-Path $workingCopy "中文 file.txt"
          Set-Content -LiteralPath $unicodeFile -Value "unicode path" -Encoding utf8NoBOM
          svn add $unicodeFile
          Assert-NativeSuccess "svn add"
          svn commit $unicodeFile -m "unicode path smoke"
          Assert-NativeSuccess "svn commit"
          svn log $unicodeFile --limit 1
          Assert-NativeSuccess "svn log"

      - name: Save verified Windows SVN cache
        if: runner.os == 'Windows' && steps.windows-svn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/versiondock-svn
          key: ${{ steps.windows-svn-cache.outputs.cache-primary-key }}

      - name: Download checked frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-ci-${{ github.sha }}
          path: dist

      - name: Install frontend dependencies
        if: inputs.bundle
        run: npm ci

      - name: Compile Windows tests and verify embedded manifests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifactsFile = Join-Path $env:RUNNER_TEMP "versiondock-rust-test-artifacts.jsonl"
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-run --message-format=json > $artifactsFile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/check-windows-test-manifests.ps1 -ArtifactsFile $artifactsFile

      - name: Run Git and SVN integration tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
        env:
          VERSIONDOCK_REQUIRE_VCS_TESTS: "1"

      - name: Check the other macOS architecture
        if: runner.os == 'macOS' && !inputs.bundle
        env:
          NATIVE_ARCH: ${{ runner.arch }}
        run: |
          case "$NATIVE_ARCH" in
            ARM64) check_target=x86_64-apple-darwin ;;
            X64) check_target=aarch64-apple-darwin ;;
            *) echo "Unsupported macOS runner architecture: $NATIVE_ARCH" >&2; exit 1 ;;
          esac
          cargo check --locked --manifest-path src-tauri/Cargo.toml --target "$check_target" --features tauri/custom-protocol

      - name: Reuse checked frontend for packaging
        if: inputs.bundle
        run: node -e "require('node:fs').writeFileSync('src-tauri/tauri.reuse-frontend.conf.json', JSON.stringify({build:{beforeBuildCommand:null}}))"

      - name: Build native bundles
        if: inputs.bundle
        run: npm run tauri:build -- --ci --config src-tauri/tauri.unsigned.conf.json --config src-tauri/tauri.reuse-frontend.conf.json ${{ matrix.bundle-args }}

      - name: Save private installation packages
        if: inputs.bundle
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: ci-packages-${{ matrix.os }}-${{ github.sha }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
          if-no-files-found: error
          retention-days: 7
